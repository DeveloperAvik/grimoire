[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grimoire"
version = "0.1.0"
description = "Catalog, documentation and launcher front-end for security tools already installed on the host"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.29,<1.0",
  "rich>=13",
  "prompt_toolkit>=3",
  "pydantic>=2",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grimoire = "grimoire.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grimoire"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "grimoire/catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
